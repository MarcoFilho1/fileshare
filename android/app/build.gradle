plugins { id 'com.android.application' }

android {
    namespace = 'dev.marcofilho.fileshare'
    compileSdk = 36
    defaultConfig {
        applicationId = 'dev.marcofilho.fileshare'
        minSdk = 33
        targetSdk = 36
        versionCode = 8
        versionName = '2.3.1'
    }
    // Chave definitiva (fora do repositório): scripts/build.sh passa o caminho e a senha, que fica
    // nas Chaves do macOS. Sem ela (ex.: outra máquina), o debug usa a chave de teste do Android.
    def keystore = System.getenv('FILESHARE_KEYSTORE')
    signingConfigs {
        if (keystore) {
            release {
                storeFile = file(keystore)
                storePassword = System.getenv('FILESHARE_KEY_PASSWORD')
                keyAlias = 'fileshare'
                keyPassword = System.getenv('FILESHARE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        if (keystore) {
            // a mesma assinatura no que eu instalo e no que é publicado: um atualiza o outro
            debug { signingConfig = signingConfigs.release }
            release { signingConfig = signingConfigs.release }
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
